name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Inject contact form email
        env:
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: |
          targets="assets/main.js prayer-director/contact.js"
          if [ -z "$CONTACT_EMAIL" ]; then
            echo "::warning::CONTACT_EMAIL secret is not set. Contact forms will be disabled."
            for f in $targets; do
              if [ -f "$f" ]; then
                sed -i "s/const CONTACT_EMAIL = '__CONTACT_EMAIL__'/const CONTACT_EMAIL = 'disabled'/" "$f"
              fi
            done
          else
            for f in $targets; do
              if [ -f "$f" ]; then
                sed -i "s/const CONTACT_EMAIL = '__CONTACT_EMAIL__'/const CONTACT_EMAIL = '${CONTACT_EMAIL}'/" "$f"
              fi
            done
          fi

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
